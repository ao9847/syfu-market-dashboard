<title>SyFu Market Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e12; --panel:#12161c; --panel-2:#181d25; --hover:#1d232d; --line:#222935; --line-2:#2c3441;
  --ink:#e9edf2; --ink-2:#a3adbb; --muted:#6c7686;
  --up:#18c07a; --down:#f0474f; --gold:#e8b44a; --gold-soft:rgba(232,180,74,.12);
  --blue:#4c8ff0; --orange:#e3703c; --aqua:#22b389;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

/* top bar */
.topbar{position:sticky;top:var(--top);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .in{display:flex;align-items:center;gap:20px;padding-inline:16px;height:52px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap;font-size:14px}
.brand img{width:28px;height:28px;border-radius:6px;display:block;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--ink-2);padding:15px 12px 13px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button:hover{color:var(--ink)}
.updated{color:var(--muted);font-size:11px;white-space:nowrap}
@media (max-width:760px){.updated{display:none}.brand span{display:none}.topbar .in{gap:8px}}

/* layout */
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);gap:12px;max-width:1440px;margin:0 auto;padding-inline:12px;padding-block:12px 40px}
.layout.nofilter{grid-template-columns:minmax(0,1fr)}
.layout.nofilter .side{display:none}
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:13px;font-weight:700;margin:0;letter-spacing:.02em}
.card-h .sub{color:var(--muted);font-size:11px}

/* sidebar */
.side{position:sticky;top:calc(var(--top) + 64px);align-self:start;max-height:calc(100vh - 76px - var(--top));display:flex;flex-direction:column}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.side-h b{font-size:12px;letter-spacing:.12em}
.side-h .res{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-left:auto}
.side-body{overflow-y:auto;flex:1;overscroll-behavior:contain}
.fg{border-bottom:1px solid var(--line)}
.fg>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;font-size:11px;letter-spacing:.12em;color:var(--ink-2);font-weight:500;user-select:none}
.fg>summary::-webkit-details-marker{display:none}
.fg>summary::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:-3px 2px 0 auto;transition:transform .15s}
.fg[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.fg>summary .sel{background:var(--gold);color:#1a1405;font-family:var(--mono);font-size:10px;font-weight:600;border-radius:9px;padding:0 6px;letter-spacing:0}
.opts{padding:0 8px 10px;display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:10px;padding:6px;border-radius:4px;cursor:pointer;font-size:12.5px}
.opt:hover{background:var(--hover)}
.opt input{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1.5px solid var(--line-2);border-radius:3px;margin:0;display:grid;place-items:center;flex:none;background:var(--panel-2);cursor:pointer}
.opt input:checked{background:var(--gold);border-color:var(--gold)}
.opt input:checked::after{content:"";width:4px;height:8px;border:solid #1a1405;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt input:indeterminate{border-color:var(--gold)}
.opt input:indeterminate::after{content:"";width:7px;height:2px;background:var(--gold)}
.opt .lab{flex:1;min-width:0}
.opt .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.opt.zero{opacity:.4}
.opt.grp{font-weight:700;letter-spacing:.06em;margin-top:4px}
.opt.sub{padding-left:31px}
.side-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.btn:hover{color:var(--ink);border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:700;flex:1}
.side-close,.fbtn,.sheet-bg{display:none}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);padding-inline:8px}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;z-index:40;border-radius:12px 12px 0 0;transform:translateY(105%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.open{transform:none}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39}
  .sheet-bg.open{display:block}
  .side-close{display:inline-block}
  .fbtn{display:inline-flex}
  .fbtn[hidden]{display:none}
}

/* ticker */
.ticker{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.t-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.t-name{font-size:17px;font-weight:700;letter-spacing:.01em}
.t-name .cnt{font-size:11px;color:var(--muted);font-weight:400;font-family:var(--mono);margin-left:8px}
.fbtn{align-items:center;gap:6px;margin-left:auto;border:1px solid var(--line-2);background:var(--panel-2);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px}
.fbtn b{background:var(--gold);color:#1a1405;border-radius:8px;padding:0 5px;font-family:var(--mono);font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--gold-soft);color:var(--gold);border:1px solid rgba(232,180,74,.35);border-radius:4px;padding:2px 4px 2px 8px;font-size:11.5px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip::after{content:"×";color:var(--ink-2);font-size:13px;line-height:1;padding:0 3px}
.chip.clear{background:none;border-color:var(--line-2);color:var(--ink-2);padding-right:8px}
.chip.clear::after{content:none}
.t-main{display:flex;align-items:flex-end;gap:10px 28px;flex-wrap:wrap}
.price{display:flex;flex-direction:column;gap:2px}
.price .big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.price .small{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(6,auto);gap:6px 26px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .k{font-size:10.5px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.stat .v{font-family:var(--mono);font-size:13px;font-weight:500;white-space:nowrap}
@media (max-width:1180px){.stats{grid-template-columns:repeat(3,auto)}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.price .big{font-size:26px}}

/* chart */
.ctools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:3px 8px;border-radius:3px;cursor:pointer;font-family:var(--mono);font-size:12px}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--panel-2)}
.seg button:hover{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:11px;align-items:center}
.legend>*{white-space:nowrap}
.legend i{display:inline-block;width:14px;height:2px;background:var(--gold);vertical-align:middle;margin-right:5px}
.legend u{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);opacity:.8;vertical-align:middle;margin-right:5px}
#priceChart{width:100%;height:440px}
@media (max-width:620px){#priceChart{height:360px}}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:right;white-space:nowrap}
th{font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.06em;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel);z-index:1}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
td{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;border-bottom:1px solid rgba(34,41,53,.6)}
td.name{font-family:var(--sans);font-size:12.5px;font-weight:500;text-align:left}
th[aria-sort="descending"]::after{content:" ▾";color:var(--ink-2)} th[aria-sort="ascending"]::after{content:" ▴";color:var(--ink-2)}
.pill{display:inline-block;font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:3px;min-width:66px;text-align:right}
.pill.up{background:rgba(24,192,122,.12)} .pill.down{background:rgba(240,71,79,.12)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--gold);border:1px solid rgba(232,180,74,.4);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.search{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;color:var(--ink);font-family:var(--mono);font-size:12px;padding:5px 9px;width:170px;max-width:100%}
.search::placeholder{color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.row2.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.row2{grid-template-columns:minmax(0,1fr)}}
.tape-scroll{max-height:420px;overflow:auto}
@media (max-width:560px){.tok{display:none}#tape th,#tape td{padding-inline:8px}#tape td.name{white-space:normal;min-width:0;line-height:1.35}#tape td:first-child{white-space:normal;width:4.6em}}
#levelChart{width:100%;height:380px}
.empty{color:var(--muted);padding:18px 14px;font-size:12px;font-family:var(--sans)}
.note{color:var(--muted);font-size:11px;padding:0 4px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>window.__DATA__=/*__DATA__*/null;</script>
<script>
(function(){
const D=window.__DATA__||{cols:[],rows:[]};
const JST=9*3600, DAY=86400;
const LINEAGES={ZENITH:['Genesis','Chronos','Nexus','Logos','Vector','Aura','Apex','Equinox'],LUNA:['Cobalt','Titanium','Nickel','Palladium','Rhodium','Iridium','Osmium','Chrome'],VEGA:['Jasper','Onyx','Zircon','Spinel','Garnet','Topaz','Beryl','Citrine'],NEBULA:['Basalt','Granite','Slate','Shale','Gneiss','Marble','Obsidian','Andesite']};
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const LGROUP_OF=lin=>{for(const g in LINEAGES)if(LINEAGES[g].includes(lin))return g;return ''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- data */
const rows=[];
D.rows.forEach(r=>{
  const o={};D.cols.forEach((c,i)=>o[c]=r[i]);
  o.day=Math.floor((o.t+JST)/DAY);
  if(o.type==='manekineko'){
    o.stage=o.level>=10?'PRIME':o.level>=3?'MINI':'POD';
    const ed=(o.name.match(/^(.+?) × SyFu/)||[])[1];
    o.edition=!ed?'STANDARD':/^1BLOCK/i.test(ed)?'1BLOCK STUDIO':ed.toUpperCase();
    o.kind=o.origin==='OG'?'OG':o.origin==='ORIGIN'?'ORIGIN':'NONE';
    o.tags=[o.kind].concat(o.talent==='elite'?['ELITE']:[]);
    o.lin=o.lineage?cap(o.lineage):'NONE';
    const p=[{common:'C',uncommon:'UC',rare:'R'}[o.rarity]||cap(o.rarity)];
    if(o.kind!=='NONE')p.push(o.kind==='OG'?'OG':'Origin');
    if(o.lineage)p.push(o.lin);
    p.push((o.rank||'').toUpperCase());
    o.seg=p.join(' ')+(o.edition!=='STANDARD'?' · '+o.edition:'');
  } else if(o.type==='genesis') o.seg='Genesis';
  else if(o.type==='breed_item') o.seg=o.variant==='COLLAB'?o.name+' (COLLAB)':o.name+' '+(o.variant||'NEW');
  else if(o.type==='excavation_right') o.seg='Right Scroll';
  else o.seg=o.name;
  o.cat=(o.type==='breed_item'||o.type==='excavation_right')?'items':o.type;
  rows.push(o);
});
rows.sort((a,b)=>b.t-a.t);

const TYPES=[['manekineko','MANEKINEKO'],['genesis','GENESIS'],['items','ITEMS']];
const ITEM_ORDER=['TAIYAKI NORMAL','TAIYAKI WHITE','The IIIRD Card (COLLAB)','Right Scroll'];
const itemOpts=()=>{const seen=new Set(rows.filter(o=>o.cat==='items').map(o=>o.seg));return ITEM_ORDER.filter(x=>seen.has(x)).concat([...seen].filter(x=>!ITEM_ORDER.includes(x)).sort())};
const FG={
  manekineko:[
    ['rarity','RARITY',['COMMON','UNCOMMON','RARE'],o=>[(o.rarity||'').toUpperCase()]],
    ['type','TYPE',['NONE','OG','ORIGIN','ELITE'],o=>o.tags],
    ['stage','STAGE',['POD','MINI','PRIME'],o=>[o.stage]],
    ['rank','PARAMETER RANK',['P0','P1','P2','P3','P4'],o=>[(o.rank||'').toUpperCase()]],
    ['edition','EDITION',['STANDARD','KDDI','LUPIN THE IIIRD','SNPIT','1BLOCK STUDIO'],o=>[o.edition]],
    ['lineage','LINEAGE',null,o=>[o.lin]],
  ],
  items:[['item','ITEM',itemOpts,o=>[o.seg]]],
};
const SHORT={COMMON:'C',UNCOMMON:'UC',RARE:'R'};

/* ---------- state */
const S={type:'manekineko',range:90,unit:'bnb',seg:null,f:{},sort:{k:'n30',d:-1},open:{}};
try{const s=JSON.parse(localStorage.getItem('smw2')||'{}');['type','range','unit'].forEach(k=>{if(s[k]!==undefined)S[k]=s[k]});if(!['manekineko','genesis','items'].includes(S.type))S.type='items';if(s.f)for(const k in s.f)S.f[k]=new Set(s.f[k]);if(s.open)S.open=s.open;}catch(e){}
function save(){try{localStorage.setItem('smw2',JSON.stringify({type:S.type,range:S.range,unit:S.unit,open:S.open,f:Object.fromEntries(Object.entries(S.f).map(([k,v])=>[k,[...v]]))}))}catch(e){}}
const fk=k=>S.type+'.'+k;
const fset=k=>S.f[fk(k)]||(S.f[fk(k)]=new Set());
function pass(o,skip){
  const gs=FG[o.cat];if(!gs)return true;
  for(const [k,,,get] of gs){if(k===skip)continue;const s=S.f[o.cat+'.'+k];if(s&&s.size&&!get(o).some(v=>s.has(v)))return false}
  return true;
}
const base=()=>rows.filter(o=>o.cat===S.type);
const filtered=()=>base().filter(o=>pass(o));
const scoped=()=>filtered().filter(o=>!S.seg||o.seg===S.seg);
const activeCount=()=>(FG[S.type]||[]).reduce((n,[k])=>n+((S.f[fk(k)]||new Set()).size),0);

/* ---------- format */
const V=o=>S.unit==='usd'?o.usd:o.bnb;
function fmt(v,u){u=u||S.unit;if(v==null||!isFinite(v))return '—';if(u==='usd')return '$'+v.toLocaleString('en-US',{minimumFractionDigits:v<100?2:0,maximumFractionDigits:v<100?2:0});return v>=10?v.toFixed(2):v>=1?v.toFixed(3):v.toFixed(4)}
const unitLab=()=>S.unit==='usd'?'USD':'BNB';
const med=a=>{if(!a.length)return NaN;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const pct=(a,b)=>isFinite(a)&&isFinite(b)&&b>0?(a/b-1)*100:NaN;
const cls=p=>!isFinite(p)?'flat':p>0.05?'up':p<-0.05?'down':'flat';
const pctTxt=p=>!isFinite(p)?'—':(p>0?'+':'')+p.toFixed(2)+'%';
const pad=n=>String(n).padStart(2,'0');
const dt=t=>{const x=new Date((t+JST)*1000);return {y:x.getUTCFullYear(),m:x.getUTCMonth()+1,d:x.getUTCDate(),h:x.getUTCHours(),mi:x.getUTCMinutes()}};
const fTime=t=>{const a=dt(t);return a.y+'/'+pad(a.m)+'/'+pad(a.d)+' '+pad(a.h)+':'+pad(a.mi)};
const fShort=t=>{const a=dt(t);return pad(a.m)+'/'+pad(a.d)+' '+pad(a.h)+':'+pad(a.mi)};
const today=()=>Math.floor((Date.now()/1000+JST)/DAY);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- tabs */
function drawTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML=TYPES.map(([v,l])=>`<button type="button" role="tab" data-v="${v}" aria-selected="${S.type===v}">${l}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.v===S.type)return;S.type=b.dataset.v;S.seg=null;save();render()};
}

/* ---------- sidebar */
function drawSide(){
  const gs=FG[S.type];
  document.getElementById('layout').classList.toggle('nofilter',!gs);
  document.getElementById('fBtn').hidden=!gs;
  if(!gs)return;
  const b=base();
  const counts=(k,get)=>{const c=new Map();b.forEach(o=>{if(pass(o,k))get(o).forEach(v=>c.set(v,(c.get(v)||0)+1))});return c};
  const opt=(k,v,n,extra)=>`<label class="opt ${n?'':'zero'} ${extra||''}"><input type="checkbox" data-k="${k}" data-v="${esc(v)}" ${fset(k).has(v)?'checked':''}><span class="lab">${esc(v)}</span><span class="n">${n}</span></label>`;
  let h='';
  for(const [k,label,opts,get] of gs){
    const c=counts(k,get);const n=fset(k).size;
    const isOpen=S.open[fk(k)]!==undefined?S.open[fk(k)]:(k!=='lineage'&&k!=='edition')||n>0;
    let body='';
    if(k==='lineage'){
      body+=opt(k,'NONE',c.get('NONE')||0);
      for(const [g,list] of Object.entries(LINEAGES)){
        const on=list.filter(x=>fset(k).has(x)).length;const gn=list.reduce((s,x)=>s+(c.get(x)||0),0);
        body+=`<label class="opt grp ${gn?'':'zero'}"><input type="checkbox" data-group="${g}" ${on===list.length?'checked':''} data-ind="${on>0&&on<list.length?1:0}"><span class="lab">${g}</span><span class="n">${gn}</span></label>`;
        body+=list.map(x=>opt(k,x,c.get(x)||0,'sub')).join('');
      }
    } else body=(typeof opts==='function'?opts():opts).map(v=>opt(k,v,c.get(v)||0)).join('');
    h+=`<details class="fg" data-k="${k}" ${isOpen?'open':''}><summary>${label}${n?`<span class="sel">${n}</span>`:''}</summary><div class="opts">${body}</div></details>`;
  }
  if(S.type==='manekineko') h+=`<p class="note" style="padding:10px 14px">STAGE は売却時レベルから判定（Lv1–2 POD / 3–9 MINI / 10+ PRIME）。同じ項目内は OR、項目どうしは AND で絞り込みます。</p>`;
  const body=document.getElementById('sideBody');const st=body.scrollTop;
  body.innerHTML=h;body.scrollTop=st;
  body.querySelectorAll('input[data-ind="1"]').forEach(i=>i.indeterminate=true);
  document.getElementById('res').textContent=filtered().length.toLocaleString()+' / '+b.length.toLocaleString()+' 件';
}
document.getElementById('sideBody').addEventListener('change',e=>{
  const i=e.target;if(i.tagName!=='INPUT')return;
  if(i.dataset.group){const l=LINEAGES[i.dataset.group],s=fset('lineage');const all=l.every(x=>s.has(x));l.forEach(x=>all?s.delete(x):s.add(x))}
  else{const s=fset(i.dataset.k);i.checked?s.add(i.dataset.v):s.delete(i.dataset.v)}
  S.seg=null;save();render();
});
document.getElementById('sideBody').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.k){S.open[fk(d.dataset.k)]=d.open;save()}},true);
document.getElementById('fReset').onclick=()=>{(FG[S.type]||[]).forEach(([k])=>delete S.f[fk(k)]);S.seg=null;save();render()};
const sheet=on=>{document.getElementById('side').classList.toggle('open',on);document.getElementById('sheetBg').classList.toggle('open',on)};
document.getElementById('fBtn').onclick=()=>sheet(true);
['sideClose','sideDone','sheetBg'].forEach(id=>document.getElementById(id).onclick=()=>sheet(false));

/* ---------- ticker */
function drawTicker(list){
  const label=TYPES.find(t=>t[0]===S.type)[1];
  const n=activeCount();
  document.getElementById('tName').innerHTML=esc(S.seg||label)+`<span class="cnt">${list.length.toLocaleString()} trades</span>`;
  const fb=document.getElementById('fBtnN');fb.hidden=!n;fb.textContent=n;
  const chips=[];
  if(S.seg)chips.push(`<button type="button" class="chip" data-seg="1">区分: ${esc(S.seg)}</button>`);
  (FG[S.type]||[]).forEach(([k])=>{
    const s=S.f[fk(k)];if(!s||!s.size)return;let items=[...s];
    if(k==='lineage')Object.entries(LINEAGES).forEach(([g,l])=>{if(l.every(x=>s.has(x))){items=items.filter(x=>!l.includes(x));chips.push(`<button type="button" class="chip" data-group="${g}">${g}</button>`)}});
    items.forEach(v=>chips.push(`<button type="button" class="chip" data-k="${k}" data-v="${esc(v)}">${esc(SHORT[v]||v)}</button>`));
  });
  if(chips.length>1)chips.push(`<button type="button" class="chip clear" data-all="1">すべて解除</button>`);
  const ce=document.getElementById('chips');ce.hidden=!chips.length;ce.innerHTML=chips.join('');
  ce.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;
    if(c.dataset.all){(FG[S.type]||[]).forEach(([k])=>delete S.f[fk(k)]);S.seg=null}
    else if(c.dataset.seg)S.seg=null;
    else if(c.dataset.group)LINEAGES[c.dataset.group].forEach(x=>fset('lineage').delete(x));
    else fset(c.dataset.k).delete(c.dataset.v);
    save();render()};
  const now=Date.now()/1000;
  const segs=[...new Set(list.map(o=>o.seg))];
  if(S.type==='items'&&segs.length>1){
    const order=ITEM_ORDER.filter(x=>segs.includes(x)).concat(segs.filter(x=>!ITEM_ORDER.includes(x)));
    const pe=document.getElementById('tPrice');pe.textContent='';pe.className='big';pe.hidden=true;
    document.getElementById('tPriceSub').textContent='直近価格と7日変動。ITEMフィルターで1つに絞ると詳細を表示します。';
    document.getElementById('stats').innerHTML=order.map(seg=>{const l=list.filter(o=>o.seg===seg);const ww=(a,b)=>l.filter(o=>o.t>now-b*DAY&&o.t<=now-a*DAY).map(V).filter(isFinite);const p7=pct(med(ww(0,7)),med(ww(7,14)));
      return `<div class="stat"><span class="k"><i style="display:inline-block;width:8px;height:2px;vertical-align:middle;margin-right:4px;background:${ITEM_COLORS[seg]||'var(--ink-2)'}"></i>${esc(seg)}</span><span class="v">${fmt(V(l[0]))} <span class="${cls(p7)}" style="font-size:11px">${pctTxt(p7)}</span></span></div>`}).join('');
    return;
  }
  const w=(a,b)=>list.filter(o=>o.t>now-b*DAY&&o.t<=now-a*DAY).map(V).filter(isFinite);
  const last=list[0];
  const m7=med(w(0,7)),mp7=med(w(7,14)),m30=med(w(0,30)),mp30=med(w(30,60));
  const l30=w(0,30),v7=w(0,7).reduce((s,x)=>s+x,0),vp7=w(7,14).reduce((s,x)=>s+x,0);
  const pe=document.getElementById('tPrice');pe.hidden=false;
  pe.textContent=last?fmt(V(last))+' '+unitLab():'—';pe.className='big '+cls(pct(m7,mp7));
  document.getElementById('tPriceSub').innerHTML=last?`直近約定 ${fShort(last.t)}${S.unit==='bnb'&&last.usd!=null?' · ≈ '+fmt(last.usd,'usd'):''}${!S.seg?' · '+esc(last.name):''}`:'該当する取引がありません';
  const st=[
    ['7D 中央値',fmt(m7)],
    ['7D 変動',`<span class="${cls(pct(m7,mp7))}">${pctTxt(pct(m7,mp7))}</span>`],
    ['30D 変動',`<span class="${cls(pct(m30,mp30))}">${pctTxt(pct(m30,mp30))}</span>`],
    ['30D 安値 / 高値',l30.length?fmt(Math.min(...l30))+' / '+fmt(Math.max(...l30)):'—'],
    ['7D 出来高',fmt(v7)+` <span class="${cls(pct(v7,vp7))}" style="font-size:11px">${pctTxt(pct(v7,vp7))}</span>`],
    ['7D / 30D 件数',w(0,7).length+' / '+l30.length],
  ];
  document.getElementById('stats').innerHTML=st.map(([k,v])=>`<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
}

/* ---------- controls */
function drawSeg(id,items,key){
  const el=document.getElementById(id);
  el.innerHTML=items.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${S[key]==v}">${l}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[key]=key==='range'?+b.dataset.v:b.dataset.v;save();render()};
}

/* ---------- charts */
const charts={};
const chart=id=>charts[id]||(charts[id]=echarts.init(document.getElementById(id),null,{renderer:'canvas'}));
const AX=()=>({axisLine:{lineStyle:{color:css('--line-2')}},axisTick:{show:false},axisLabel:{color:css('--muted'),fontFamily:'IBM Plex Mono',fontSize:10.5},splitLine:{lineStyle:{color:css('--line'),type:[3,3]}}});
const TIP=()=>({backgroundColor:css('--panel-2'),borderColor:css('--line-2'),textStyle:{color:css('--ink'),fontSize:12,fontFamily:'IBM Plex Mono'},extraCssText:'border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.4)'});
const dayLab=d=>{const x=new Date(d*DAY*1000);return pad(x.getUTCMonth()+1)+'/'+pad(x.getUTCDate())};

const ITEM_COLORS={'TAIYAKI NORMAL':'#4c8ff0','TAIYAKI WHITE':'#e3703c','The IIIRD Card (COLLAB)':'#22b389','Right Scroll':'#d9a21b'};
function drawPrice(list){
  const now=Date.now()/1000;const r=list.filter(o=>isFinite(V(o)));
  const B=S.range===1?3600:S.range===7?4*3600:DAY;
  const bk=t=>Math.floor((t+JST)/B);
  const start=S.range?now-S.range*DAY:(r.length?r[r.length-1].t:now);
  const d0=bk(start),T=bk(now);
  const lab=b=>{const x=new Date(b*B*1000);const md=pad(x.getUTCMonth()+1)+'/'+pad(x.getUTCDate());return B===DAY?md:B===3600?pad(x.getUTCHours())+':00':md+' '+pad(x.getUTCHours())+'時'};
  const idx=b=>b-d0;
  const days=[];for(let d=d0;d<=T;d++)days.push(lab(d));
  const inR=r.filter(o=>o.t>=start).map(o=>Object.assign(Object.create(o),{day:bk(o.t)}));
  const segs=[...new Set(inR.map(o=>o.seg))];
  const multi=S.type==='items'&&segs.length>1;
  const daily=l=>{const m=new Map();l.forEach(o=>{if(!m.has(o.day))m.set(o.day,[]);m.get(o.day).push(V(o))});return m};
  const all=daily(inR);
  const byB=new Map();inR.forEach(o=>{if(!byB.has(o.day))byB.set(o.day,[]);byB.get(o.day).push(o)});
  const segOrder=ITEM_ORDER.filter(x=>segs.includes(x)).concat(segs.filter(x=>!ITEM_ORDER.includes(x)));
  const vol=days.map((_,i)=>{const a=all.get(d0+i);return a?a.reduce((s,x)=>s+x,0):0});
  const cnt=days.map((_,i)=>(all.get(d0+i)||[]).length);
  const ax=AX();const series=[];
  const leg=document.getElementById('legend');
  if(multi){
    const order=ITEM_ORDER.filter(x=>segs.includes(x)).concat(segs.filter(x=>!ITEM_ORDER.includes(x)));
    order.forEach(seg=>{const m=daily(inR.filter(o=>o.seg===seg));const c=ITEM_COLORS[seg]||css('--ink-2');
      series.push({name:seg,type:'line',data:days.map((_,i)=>{const a=m.get(d0+i);return a?med(a):'-'}),connectNulls:true,showSymbol:true,symbolSize:4,lineStyle:{width:2,color:c},itemStyle:{color:c}})});
    leg.innerHTML=`<b style="color:var(--ink)">${B===DAY?'日次':B===3600?'1時間ごとの':'4時間ごとの'}中央値</b>`+order.map(x=>`<span><i style="background:${ITEM_COLORS[x]||'var(--ink-2)'}"></i>${esc(x)}</span>`).join('');
  } else {
    const med1=days.map((_,i)=>{const a=all.get(d0+i);return a?med(a):'-'});
    const c=css('--gold');
    series.push({name:'個別の約定',type:'scatter',data:inR.map(o=>[idx(o.day),V(o)]),symbolSize:B===DAY?6:8,itemStyle:{color:css('--blue'),opacity:.8,borderColor:css('--panel'),borderWidth:1},silent:true,z:2});
    series.push({name:'日次中央値',type:'line',data:med1,connectNulls:true,showSymbol:true,symbol:'circle',symbolSize:4,lineStyle:{width:2,color:c},itemStyle:{color:c},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(232,180,74,.18)'},{offset:1,color:'rgba(232,180,74,0)'}])},z:3,
      markLine:{symbol:'none',silent:true,precision:8,label:{position:'end',formatter:p=>fmt(p.value),color:'#0b0e12',backgroundColor:css('--ink-2'),padding:[2,4],borderRadius:2,fontFamily:'IBM Plex Mono',fontSize:10.5},lineStyle:{color:css('--ink-2'),type:'dashed',width:1},data:r.length?[{yAxis:V(r[0])}]:[]}});
    leg.innerHTML=`<span><i></i>${B===DAY?'日次':B===3600?'1時間ごとの':'4時間ごとの'}中央値</span><span><u></u>個別の約定</span><span class="flat">破線 = 直近の成約価格</span>`;
  }
  series.push({name:'出来高',type:'bar',data:vol,xAxisIndex:1,yAxisIndex:1,barMaxWidth:10,itemStyle:{color:'rgba(163,173,187,.35)',borderRadius:[2,2,0,0]}});
  chart('priceChart').setOption({
    animation:false,
    axisPointer:{link:[{xAxisIndex:'all'}],lineStyle:{color:css('--muted'),type:'dashed'},label:{backgroundColor:css('--line-2'),fontFamily:'IBM Plex Mono',formatter:p=>typeof p.value==='number'?fmt(p.value):p.value}},
    tooltip:{...TIP(),trigger:'axis',axisPointer:{type:'cross'},formatter:ps=>{
      // bucket index must come from a per-bucket series (line/bar), never from the scatter of individual trades
      const ref=ps.find(p=>p.seriesType!=='scatter');
      let i=ref?ref.dataIndex:days.indexOf(ps[0].axisValue);
      if(i<0||i==null)return '';
      const a=all.get(d0+i)||[];
      const trades=byB.get(d0+i)||[];
      let h=`<b>${days[i]}</b> <span style="color:${css('--muted')}">${cnt[i]}件</span>`;
      if(multi){
        segOrder.forEach(seg=>{const ts=trades.filter(o=>o.seg===seg);if(!ts.length)return;h+=`<br><span style="color:${ITEM_COLORS[seg]||css('--ink-2')}">●</span> ${esc(seg)} 中央値 ${fmt(med(ts.map(V)))}（${ts.length}件）`});
      } else if(a.length){
        h+=`<br><span style="color:${css('--gold')}">中央値 ${fmt(med(a))}</span>　安 ${fmt(Math.min(...a))} / 高 ${fmt(Math.max(...a))}`;
      } else h+=`<br><span style="color:${css('--muted')}">約定なし</span>`;
      if(trades.length){
        h+=`<div style="margin-top:4px;padding-top:4px;border-top:1px solid ${css('--line-2')}">`+trades.slice(0,10).map(o=>`${fShort(o.t)}　${fmt(V(o))}${multi?' · '+esc(o.seg):''}`).join('<br>')+(trades.length>10?`<br><span style="color:${css('--muted')}">ほか ${trades.length-10}件</span>`:'')+`</div>`;
      }
      return h+(trades.length?'':'<br>')+`出来高 ${fmt(vol[i])} ${unitLab()}`}},
    legend:{show:false},
    grid:[{left:10,right:66,top:16,height:'64%'},{left:10,right:66,top:'78%',bottom:24}],
    xAxis:[{type:'category',data:days,...ax,axisLabel:{show:false},splitLine:{show:false},boundaryGap:true},{type:'category',data:days,gridIndex:1,...ax,splitLine:{show:false},boundaryGap:true}],
    yAxis:[{type:'value',scale:true,position:'right',...ax,axisLabel:{...ax.axisLabel,formatter:v=>fmt(v)}},{type:'value',gridIndex:1,position:'right',...ax,splitNumber:2,axisLabel:{...ax.axisLabel,formatter:v=>fmt(v)}}],
    dataZoom:[{type:'inside',xAxisIndex:[0,1],start:0,end:100}],
    series
  },true);
}

function drawLevel(list){
  const show=S.type==='manekineko';
  document.getElementById('levelCard').hidden=!show;
  document.getElementById('row2').classList.toggle('one',!show);
  if(!show)return;
  const now=Date.now()/1000;const r=list.filter(o=>(!S.range||o.t>now-S.range*DAY)&&isFinite(V(o)));
  const groups=[['common','C',css('--blue')],['uncommon','UC',css('--orange')],['rare','R',css('--aqua')]].filter(([k])=>r.some(o=>o.rarity===k));
  const ax=AX();
  chart('levelChart').setOption({
    animation:false,grid:{left:10,right:60,top:34,bottom:28},
    legend:{top:6,left:10,textStyle:{color:css('--ink-2'),fontSize:11},itemWidth:8,itemHeight:8,icon:'circle'},
    tooltip:{...TIP(),trigger:'item',formatter:p=>`<b>${esc(p.data[2])}</b> #${esc(p.data[3])}<br>Lv.${p.data[0]} · ${fmt(p.data[1])} ${unitLab()}<br><span style="color:${css('--muted')}">${fTime(p.data[4])}</span>`},
    xAxis:{type:'value',...ax,min:0,name:'Lv',nameTextStyle:{color:css('--muted'),fontSize:10.5},minInterval:1,splitLine:{show:false}},
    yAxis:{type:'value',scale:true,position:'right',...ax,axisLabel:{...ax.axisLabel,formatter:v=>fmt(v)}},
    series:groups.map(([k,l,c])=>({name:l,type:'scatter',symbolSize:7,data:r.filter(o=>o.rarity===k).map(o=>[o.level,V(o),o.seg,o.token,o.t]),itemStyle:{color:c,opacity:.7,borderColor:css('--panel'),borderWidth:1}}))
  },true);
}

/* ---------- tape */
let scopedCache=[];
function drawTape(list){
  const q=document.getElementById('q').value.trim().replace(/^#/,'');
  const el=document.getElementById('tape');
  let l=list,head='';
  if(q){
    l=rows.filter(o=>o.token===q&&(o.type==='manekineko'||o.type==='genesis'));
    if(!l.length){el.innerHTML=`<p class="empty">#${esc(q)} の成約はまだ記録されていません。</p>`;return}
    const a=l[l.length-1],b=l[0];
    head=`<p class="empty" style="padding-bottom:4px;color:var(--ink-2)">${esc(b.seg)} #${esc(q)} · ${l.length}回売買 · ${fmt(a.bnb,'bnb')} → ${fmt(b.bnb,'bnb')} BNB ${l.length>1?`<span class="${cls(pct(b.bnb,a.bnb))}">${pctTxt(pct(b.bnb,a.bnb))}</span>`:''}</p>`;
  }
  const linTag=o=>o.type==='manekineko'&&o.lineage?`<span class="tag">${LGROUP_OF(o.lin)?'['+LGROUP_OF(o.lin)[0]+'] ':''}${esc(o.lin.toUpperCase())}</span>`:'';
  const nameOf=o=>o.type==='breed_item'?esc(o.name)+' <span class="tag">'+esc(o.variant||'NEW')+'</span>':esc(o.name);
  const showLv=l.some(o=>o.type==='manekineko');
  const body=l.slice(0,100).map(o=>`<tr><td>${fShort(o.t)}</td><td class="name">${nameOf(o)}${linTag(o)}${o.talent==='elite'?'<span class="tag">ELITE</span>':''}</td>${showLv?`<td>${o.level?'Lv.'+o.level:''}</td>`:''}<td>${fmt(o.bnb,'bnb')}</td><td class="tok">${o.usd!=null?fmt(o.usd,'usd'):'—'}</td></tr>`).join('');
  el.innerHTML=head+`<table><thead><tr><th>日時 (JST)</th><th style="text-align:left">名前</th>${showLv?'<th>Lv</th>':''}<th>BNB</th><th class="tok">USD</th></tr></thead><tbody>${body||'<tr><td class="empty" colspan="5">取引がありません</td></tr>'}</tbody></table>`;
}
document.getElementById('q').addEventListener('input',()=>drawTape(scopedCache));

/* ---------- render */
function render(){
  drawTabs();drawSide();
  drawSeg('rangeSeg',[[1,'1D'],[7,'7D'],[30,'30D'],[90,'90D'],[0,'ALL']],'range');
  drawSeg('unitSeg',[['bnb','BNB'],['usd','USD']],'unit');
  scopedCache=scoped();
  drawTicker(scopedCache);drawPrice(scopedCache);drawTape(scopedCache);drawLevel(scopedCache);
  // layout can change between tabs (sidebar shown/hidden), so refit charts to their containers
  requestAnimationFrame(()=>Object.values(charts).forEach(c=>c.resize()));
}
const lr=D.lastRun||D.built;
document.getElementById('updated').innerHTML=`最終取得 <span class="mono">${lr?fTime(lr):'—'}</span> · <span class="mono">${rows.length.toLocaleString()}</span> trades`;
document.getElementById('foot').textContent=`データ: manekineko.syfu.io/activity の成約履歴（${rows.length.toLocaleString()}件 / サイト表示 ${(D.siteTotal||0).toLocaleString()}件）。データは3時間おきに取得。このページへの反映は依頼時。USDは成約時点の表示値、日付の区切りは日本時間。`;
render();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>Object.values(charts).forEach(c=>c.resize()),120)});
})();
</script>
